services:
  # PostgreSQL database
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Redis for Celery
  redis:
    image: redis:7
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django backend
  backend:
    build: ./backend
    # ports:
    #   - "8000:8000"
    restart: always
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - HUAWEICLOUD_SDK_AK=${HUAWEICLOUD_SDK_AK}
      - HUAWEICLOUD_SDK_SK=${HUAWEICLOUD_SDK_SK}
      - MODELARTS_ENDPOINT_URL=${MODELARTS_ENDPOINT_URL}
      - CORS_ALLOWED_ORIGINS=http://frontend:3000,http://localhost:3000,http://localhost
    command: supervisord -c /etc/supervisor/conf.d/supervisord.conf

  # Next.js frontend
  frontend:
    build: 
      context: ./frontend/huawei-naisc
      args:
        - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
    restart: always
    depends_on:
      - backend
    env_file:
      - ./.env
    environment:
      - BACKEND_API_URL=http://backend:8000/api
      - HOSTNAME=0.0.0.0
      - PORT=3000

  # Nginx for serving static files and routing
  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: